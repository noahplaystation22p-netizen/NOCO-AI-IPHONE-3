name: Build NOCO AI IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-15
    concurrency:
      group: build-nocoai-ipa-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          # Prefer a stable Xcode 16.x on macos-15 if present
          ls /Applications | grep -i Xcode || true
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          fi
          xcodebuild -version

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build

          run_build() {
            local clean_flag="$1"
            rm -rf build/DerivedData
            # shellcheck disable=SC2086
            # Do NOT force -sdk iphoneos: Watch companion must compile with watchOS SDK.
            xcodebuild $clean_flag build \
              -project NOCOAI.xcodeproj \
              -scheme NOCOAI \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              -jobs 1 \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_STYLE=Manual \
              VALIDATE_PRODUCT=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              SWIFT_COMPILATION_MODE=incremental \
              SWIFT_WHOLE_MODULE_OPTIMIZATION=NO \
              2>&1 | tee build/xcodebuild.log
            grep -q "BUILD SUCCEEDED" build/xcodebuild.log
          }

          if ! run_build clean; then
            if grep -qi "build system has crashed\|unexpected service error" build/xcodebuild.log; then
              echo "=== Xcode build system crashed — retrying once (no clean) ==="
              sleep 8
              if ! run_build ""; then
                echo "=== xcodebuild failed after retry ==="
                grep -E "error:|fatal error:|BUILD FAILED" build/xcodebuild.log | tail -40 || tail -80 build/xcodebuild.log
                exit 1
              fi
            else
              echo "=== xcodebuild failed ==="
              grep -E "error:|fatal error:|BUILD FAILED" build/xcodebuild.log | tail -40 || tail -80 build/xcodebuild.log
              exit 1
            fi
          fi

          APP_PATH=$(find build/DerivedData -name "NOCOAI.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "NOCOAI.app not found"
            tail -100 build/xcodebuild.log
            exit 1
          fi

          echo "=== App bundle contents ==="
          ls -la "$APP_PATH"
          ls -la "$APP_PATH/PlugIns" || true

          # Live Activities REQUIRE the widget appex; AI keyboard requires keyboard appex
          WIDGET_APEX=$(find "$APP_PATH/PlugIns" -name "NOCOAISpeakWidget.appex" -type d 2>/dev/null | head -1 || true)
          KEYBOARD_APEX=$(find "$APP_PATH/PlugIns" -name "NOCOAIKeyboard.appex" -type d 2>/dev/null | head -1 || true)
          if [ -z "$WIDGET_APEX" ]; then
            echo "FATAL: NOCOAISpeakWidget.appex missing from PlugIns — Live Activities cannot work"
            find "$APP_PATH" -maxdepth 3 -type d
            exit 1
          fi
          if [ -z "$KEYBOARD_APEX" ]; then
            echo "FATAL: NOCOAIKeyboard.appex missing from PlugIns — AI keyboard cannot work"
            ls -la "$APP_PATH/PlugIns" || true
            exit 1
          fi
          echo "Found Live Activity widget: $WIDGET_APEX"
          echo "Found AI keyboard: $KEYBOARD_APEX"

          WATCH_APP=$(find "$APP_PATH" -path "*/Watch/*.app" -type d 2>/dev/null | head -1 || true)
          if [ -z "$WATCH_APP" ]; then
            echo "FATAL: Watch companion app missing under Watch/ — Apple Watch install will not work"
            find "$APP_PATH" -maxdepth 4 -type d
            exit 1
          fi
          echo "Found Watch app: $WATCH_APP"

          # Force ATS cleartext allow — Tailscale 100.x is not "local networking".
          # GENERATE_INFOPLIST_FILE merges can drop nested ATS dicts; inject explicitly.
          APP_PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true" "$APP_PLIST"
          echo "=== ATS in app Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$APP_PLIST"
          # Fail the build if Tailscale cleartext would still be blocked by a missing ATS flag.
          ATS_ARB=$(/usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$APP_PLIST" 2>/dev/null || echo "false")
          if [ "$ATS_ARB" != "true" ]; then
            echo "FATAL: NSAllowsArbitraryLoads is not true in app Info.plist (got: $ATS_ARB)"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST"

          # Same for keyboard extension (HTTP to companion)
          if [ -n "$KEYBOARD_APEX" ]; then
            KBD_PLIST="$KEYBOARD_APEX/Info.plist"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$KBD_PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$KBD_PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$KBD_PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$KBD_PLIST"
          fi

          # Sign nested Watch app + extensions first, then the app (ad-hoc).
          # --generate-entitlement-der is required for modern watchOS install checks.
          if [ -n "$WATCH_APP" ]; then
            # Drop stale signature so nested resign is clean for sideloaders.
            rm -rf "$WATCH_APP/_CodeSignature"
            codesign --force --sign - --timestamp=none --generate-entitlement-der \
              --entitlements NOCOWatch/NOCOWatch.entitlements "$WATCH_APP" || \
            codesign --force --sign - --timestamp=none --generate-entitlement-der "$WATCH_APP"
            # Fail early if Watch has no icon catalog (install shows blank + often fails).
            if [ ! -f "$WATCH_APP/Assets.car" ] && [ ! -d "$WATCH_APP/AppIcon.appiconset" ]; then
              ls -la "$WATCH_APP"
              echo "FATAL: Watch app missing Assets.car / AppIcon — icon required for Watch install"
              exit 1
            fi
            # Sideload installs are fragile with App Intents metadata on watchOS.
            rm -rf "$WATCH_APP/Metadata.appintents"
            # Keep companion + version aligned with what iLoader expects.
            /usr/libexec/PlistBuddy -c "Set :WKCompanionAppBundleIdentifier de.noco.nocoai.96R99M23VH" "$WATCH_APP/Info.plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :WKCompanionAppBundleIdentifier string de.noco.nocoai.96R99M23VH" "$WATCH_APP/Info.plist"
            # Match marketing/build strings to the iPhone app (Watch install rejects mismatches).
            IPHONE_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PLIST" 2>/dev/null || echo "8.9")
            IPHONE_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST" 2>/dev/null || echo "118")
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $IPHONE_VER" "$WATCH_APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IPHONE_BUILD" "$WATCH_APP/Info.plist"
            echo "=== Watch Info.plist ==="
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$WATCH_APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$WATCH_APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WATCH_APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$WATCH_APP/Info.plist"
          fi
          find "$APP_PATH" -name "*.appex" -type d -print0 | while IFS= read -r -d '' ext; do
            case "$(basename "$ext")" in
              NOCOAIKeyboard.appex)
                codesign --force --sign - --timestamp=none --generate-entitlement-der \
                  --entitlements NOCOAIKeyboard/NOCOAIKeyboard.entitlements "$ext"
                ;;
              NOCOAISpeakWidget.appex)
                codesign --force --sign - --timestamp=none --generate-entitlement-der \
                  --entitlements NOCOAISpeakWidget/NOCOAISpeakWidget.entitlements "$ext"
                ;;
              NOCOAIBroadcast.appex)
                codesign --force --sign - --timestamp=none --generate-entitlement-der \
                  --entitlements NOCOAIBroadcast/NOCOAIBroadcast.entitlements "$ext"
                ;;
              *)
                codesign --force --sign - --timestamp=none --generate-entitlement-der "$ext"
                ;;
            esac
          done
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements NOCOAI/NOCOAI.entitlements "$APP_PATH"

          mkdir -p build/Payload
          rm -rf build/Payload/NOCOAI.app
          cp -R "$APP_PATH" build/Payload/NOCOAI.app
          mkdir -p build/sidestore-entitlements
          cp NOCOAI/NOCOAI.entitlements build/sidestore-entitlements/NOCOAI.plist
          cp NOCOAIKeyboard/NOCOAIKeyboard.entitlements build/sidestore-entitlements/NOCOAIKeyboard.plist
          cp NOCOAIBroadcast/NOCOAIBroadcast.entitlements build/sidestore-entitlements/NOCOAIBroadcast.plist
          cp sidestore-entitlements/ANLEITUNG.txt build/sidestore-entitlements/ANLEITUNG.txt
          cd build && zip -rq NOCO-AI.ipa Payload sidestore-entitlements
          ls -la NOCO-AI.ipa

          # Verify IPA contains the widget + broadcast extension
          unzip -l NOCO-AI.ipa | grep -E "appex|PlugIns" || {
            echo "FATAL: IPA missing PlugIns/appex"
            exit 1
          }
          unzip -l NOCO-AI.ipa | grep -q "NOCOAIBroadcast.appex" || {
            echo "FATAL: IPA missing NOCOAIBroadcast.appex — Live Screen broadcast cannot work"
            exit 1
          }
          unzip -l NOCO-AI.ipa | grep -q "Watch/NOCOWatch.app" || {
            echo "FATAL: IPA missing Watch/NOCOWatch.app — Apple Watch companion missing"
            unzip -l NOCO-AI.ipa | grep -i watch || true
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOCO-AI-ipa
          path: build/NOCO-AI.ipa
          retention-days: 90
